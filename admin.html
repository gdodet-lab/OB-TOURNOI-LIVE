<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration - OB Tournoi Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    header {
      background: linear-gradient(135deg, #63c5da, #8dd7e8);
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 6px 0 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      text-decoration: none;
      color: #0ea5e9;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .club-button {
      background: #0ea5e9;
      color: white;
    }

    .team-button {
      background: #f59e0b;
      color: white;
    }

    .section-button {
      background: #334155;
      color: white;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .category {
      background: #f1f5f9;
      padding: 12px 5px;
      text-align: center;
      border-radius: 9px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: #64748b;
      margin: 20px 0;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .categories {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⚙️ Administration</h1>
  <p>OB Tournoi Live</p>
</header>

<main class="container">

  <a href="/" class="back">← Retour à l'accueil</a>

  <div class="card">
    <h2>🏉 Tournoi EDR</h2>
    <p><strong>Olympique de Besançon</strong></p>
    <p>Besançon • Mai 2027</p>

    <div id="categories" class="categories">
      <div>Chargement...</div>
    </div>
  </div>

  <div class="card">
    <h2>🏠 Clubs</h2>

    <label>Nom du club</label>
    <input
      id="clubName"
      type="text"
      placeholder="Ex. Olympique de Besançon"
    >

    <button class="club-button">
      + Ajouter le club
    </button>
  </div>

  <div class="card">
    <h2>👥 Équipes</h2>

    <label>Club</label>
    <select id="clubSelect">
      <option>Sélectionner un club</option>
    </select>

    <label>Nom de l'équipe</label>
    <input
      id="teamName"
      type="text"
      placeholder="Ex. BESANCON 1"
    >

    <label>Catégorie</label>
    <select id="categorySelect">
      <option value="">Sélectionner une catégorie</option>
    </select>

    <button class="team-button">
      + Ajouter l'équipe
    </button>

    <div id="teamsList" style="margin-top: 20px;">
  <p>Chargement des équipes...</p>
</div>
  </div>

  <div class="card">
    <h2>Organisation sportive</h2>

    <h3>🏟️ Terrains</h3>

<label>Nom du terrain</label>
<input
  id="fieldName"
  type="text"
  placeholder="Ex. Terrain 1"
>

<button
  id="addFieldButton"
  class="section-button"
>
  + Ajouter le terrain
</button>

<div id="fieldsList" style="margin-top: 20px;">
  <p>Chargement des terrains...</p>
</div>
    <button class="section-button">📋 Poules</button>
    <button class="section-button">🏉 Matchs</button>
  </div>

  <div id="status" class="status">
    Connexion aux données...
  </div>

</main>

<script>

async function chargerCategories() {

  const zone = document.getElementById("categories");
  const select = document.getElementById("categorySelect");
  const status = document.getElementById("status");

  try {

    const response = await fetch("/api/categories");

    if (!response.ok) {
      throw new Error("Erreur API");
    }

    const categories = await response.json();

    zone.innerHTML = "";

    categories.forEach(categorie => {

      const bloc = document.createElement("div");
      bloc.className = "category";
      bloc.textContent = categorie.name;
      zone.appendChild(bloc);

      const option = document.createElement("option");
      option.value = categorie.id;
      option.textContent = categorie.name;
      select.appendChild(option);

    });

    status.textContent = "🟢 Administration connectée aux données";

  } catch (error) {

    console.error(error);

    zone.innerHTML =
      "<div>Impossible de charger les catégories.</div>";

    status.textContent =
      "🔴 Erreur de connexion aux données";

  }

}
// ===============================
// GESTION DES CLUBS
// ===============================

async function chargerClubs() {
  try {
    const response = await fetch("/api/clubs");

    if (!response.ok) {
      throw new Error("Impossible de charger les clubs");
    }

    const clubs = await response.json();

    const selectClub = document.getElementById("clubSelect");

    if (!selectClub) return;

    selectClub.innerHTML =
      '<option value="">Sélectionner un club</option>';

    clubs.forEach(club => {
      const option = document.createElement("option");
      option.value = club.id;
      option.textContent = club.name;
      selectClub.appendChild(option);
    });

  } catch (error) {
    console.error("Erreur chargement clubs :", error);
  }
}


async function ajouterClub() {

  const input = document.getElementById("clubName");

  if (!input) return;

  const name = input.value.trim();

  if (!name) {
    alert("Merci de saisir le nom du club.");
    return;
  }

  try {

    const response = await fetch("/api/clubs", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name })
    });

    const data = await response.json();

    if (!response.ok) {
      console.error(data);
      alert("Impossible d'ajouter le club.");
      return;
    }

    input.value = "";

    alert("Club ajouté avec succès.");

    await chargerClubs();

  } catch (error) {

    console.error(error);
    alert("Erreur lors de l'ajout du club.");

  }
}
// ===============================
// GESTION DES ÉQUIPES
// ===============================
// ===============================
// GESTION DES ÉQUIPES
// ===============================

async function modifierEquipe(id) {

  try {
    const response = await fetch("/api/teams");

    if (!response.ok) {
      alert("Impossible de charger l'équipe.");
      return;
    }

    const equipes = await response.json();
    const equipe = equipes.find(e => e.id === id);

    if (!equipe) {
      alert("Équipe introuvable.");
      return;
    }

    const nouveauNom = prompt(
      "Nom de l'équipe :",
      equipe.name
    );

    if (!nouveauNom || !nouveauNom.trim()) return;

    const responseModification = await fetch("/api/teams", {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: equipe.id,
        name: nouveauNom.trim(),
        club_id: equipe.club_id,
        category_id: equipe.category_id
      })
    });

    const data = await responseModification.json();

    if (!responseModification.ok) {
      console.error(data);
      alert("Impossible de modifier l'équipe.");
      return;
    }

    await chargerEquipes();

    alert("Équipe modifiée avec succès.");

  } catch (error) {
    console.error(error);
    alert("Erreur lors de la modification de l'équipe.");
  }
}


async function supprimerEquipe(id, nom) {

  const confirmation = confirm(
    `Supprimer l'équipe "${nom}" ?`
  );

  if (!confirmation) return;

  try {

    const response = await fetch("/api/teams", {
      method: "DELETE",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ id })
    });

    const data = await response.json();

    if (!response.ok) {
      console.error(data);
      alert("Impossible de supprimer l'équipe.");
      return;
    }

    await chargerEquipes();

    alert("Équipe supprimée avec succès.");

  } catch (error) {
    console.error(error);
    alert("Erreur lors de la suppression de l'équipe.");
  }
}


async function chargerEquipes() {

  const zone = document.getElementById("teamsList");

  if (!zone) return;

  try {

    const response = await fetch("/api/teams");

    if (!response.ok) {
      throw new Error("Impossible de charger les équipes");
    }

    const equipes = await response.json();

    if (equipes.length === 0) {
      zone.innerHTML = "<p>Aucune équipe enregistrée.</p>";
      return;
    }

    zone.innerHTML = "<h3>Équipes enregistrées</h3>";

    equipes.forEach(equipe => {

      const ligne = document.createElement("div");

      ligne.style.padding = "10px";
      ligne.style.marginBottom = "8px";
      ligne.style.background = "#f1f5f9";
      ligne.style.borderRadius = "8px";

      ligne.innerHTML = `
        <strong>${equipe.name}</strong><br>

        <span style="color: #64748b; font-size: 14px;">
          🏠 ${equipe.clubs?.name || "Club inconnu"} •
          🏉 ${equipe.categories?.name || "Catégorie inconnue"}
        </span>

        <button
          onclick="modifierEquipe(${equipe.id})"
          style="
            background: #0ea5e9;
            color: white;
            margin-top: 10px;
            padding: 8px;
            font-size: 14px;
          "
        >
          ✏️ Modifier
        </button>

        <button
          onclick="supprimerEquipe(${equipe.id}, '${equipe.name}')"
          style="
            background: #ef4444;
            color: white;
            margin-top: 10px;
            padding: 8px;
            font-size: 14px;
          "
        >
          🗑️ Supprimer
        </button>
      `;

      zone.appendChild(ligne);
    });

  } catch (error) {
    console.error(error);
    zone.innerHTML = "<p>Impossible de charger les équipes.</p>";
  }
}


async function ajouterEquipe() {

  const clubSelect = document.getElementById("clubSelect");
  const teamName = document.getElementById("teamName");
  const categorySelect = document.getElementById("categorySelect");

  const club_id = clubSelect.value;
  const name = teamName.value.trim();
  const category_id = categorySelect.value;

  if (!club_id) {
    alert("Merci de sélectionner un club.");
    return;
  }

  if (!name) {
    alert("Merci de saisir le nom de l'équipe.");
    return;
  }

  if (!category_id) {
    alert("Merci de sélectionner une catégorie.");
    return;
  }

  try {

    const response = await fetch("/api/teams", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        club_id,
        category_id,
        name,
        team_number: 1
      })
    });

    const data = await response.json();

    if (!response.ok) {
      console.error(data);
      alert("Impossible d'ajouter l'équipe.");
      return;
    }

    teamName.value = "";
    categorySelect.value = "";

    await chargerEquipes();

    alert("Équipe ajoutée avec succès.");

  } catch (error) {
    console.error(error);
    alert("Erreur lors de l'ajout de l'équipe.");
  }
}
  // ===============================
// GESTION DES TERRAINS
// ===============================

async function chargerTerrains() {

  const zone = document.getElementById("fieldsList");

  if (!zone) return;

  try {

    const response = await fetch("/api/fields");

    if (!response.ok) {
      throw new Error("Impossible de charger les terrains");
    }

    const terrains = await response.json();

    if (terrains.length === 0) {
      zone.innerHTML = "<p>Aucun terrain enregistré.</p>";
      return;
    }

    zone.innerHTML = "<h3>Terrains enregistrés</h3>";

    terrains.forEach(terrain => {

      const ligne = document.createElement("div");

      ligne.style.padding = "10px";
      ligne.style.marginBottom = "8px";
      ligne.style.background = "#f1f5f9";
      ligne.style.borderRadius = "8px";

      ligne.innerHTML = `
        <strong>🏟️ ${terrain.name}</strong>
      `;

      zone.appendChild(ligne);
    });

  } catch (error) {
    console.error(error);
    zone.innerHTML = "<p>Impossible de charger les terrains.</p>";
  }
}


async function ajouterTerrain() {

  const input = document.getElementById("fieldName");

  if (!input) return;

  const name = input.value.trim();

  if (!name) {
    alert("Merci de saisir le nom du terrain.");
    return;
  }

  try {

    const response = await fetch("/api/fields", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name
      })
    });

    const data = await response.json();

    if (!response.ok) {
      console.error(data);
      alert("Impossible d'ajouter le terrain.");
      return;
    }

    input.value = "";

    await chargerTerrains();

    alert("Terrain ajouté avec succès.");

  } catch (error) {
    console.error(error);
    alert("Erreur lors de l'ajout du terrain.");
  }
}
// Activation du bouton Ajouter le club
const boutonClub = document.querySelector(".club-button");

if (boutonClub) {
  boutonClub.addEventListener("click", ajouterClub);
}
// Activation du bouton Ajouter l'équipe
const boutonEquipe = document.querySelector(".team-button");

if (boutonEquipe) {
  boutonEquipe.addEventListener("click", ajouterEquipe);
}

  // Activation du bouton Ajouter le terrain
const boutonTerrain = document.getElementById("addFieldButton");

if (boutonTerrain) {
  boutonTerrain.addEventListener("click", ajouterTerrain);
}
// Chargement initial des clubs
chargerClubs();
  
chargerCategories();

  chargerEquipes();

  chargerTerrains();
</script>

</body>
</html>
